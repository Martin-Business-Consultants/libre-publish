<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libre Publish</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc;
  --accent: #2f5bd3; --accent-ink: #ffffff; --ok: #1f7a4d; --warn: #9a6400; --bad: #b3261e;
  --chip: #eeede8; --focus: #2f5bd355; --radius: 8px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151514; --panel: #1e1e1c; --ink: #ecebe6; --muted: #a09f98; --line: #34332f;
    --accent: #7d9bff; --accent-ink: #10131c; --ok: #5fc38f; --warn: #e0b35c; --bad: #ff8a80;
    --chip: #2a2a27; --focus: #7d9bff55; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151514; --panel: #1e1e1c; --ink: #ecebe6; --muted: #a09f98; --line: #34332f;
  --accent: #7d9bff; --accent-ink: #10131c; --ok: #5fc38f; --warn: #e0b35c; --bad: #ff8a80;
  --chip: #2a2a27; --focus: #7d9bff55; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 20px; margin: 0 0 4px; }
h2 { font-size: 15px; margin: 24px 0 8px; }
h3 { font-size: 13px; margin: 0; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
nav.side { background: var(--panel); border-right: 1px solid var(--line); padding: 16px 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
nav.side .brand { font-weight: 650; padding: 4px 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
nav.side .group { margin: 14px 10px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
nav.side a { display: block; padding: 6px 10px; border-radius: 6px; color: var(--ink); }
nav.side a:hover { background: var(--chip); text-decoration: none; }
nav.side a.on { background: var(--accent); color: var(--accent-ink); }
nav.side .count { float: right; background: var(--bad); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; }
main { padding: 24px 32px 80px; max-width: 1100px; width: 100%; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.sub { color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--bg); }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--bg); }
button, .btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { color: var(--bad); }
button.small { padding: 2px 8px; font-size: 12px; }
button:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
label.field { display: block; margin-bottom: 14px; }
label.field > span.lbl { display: block; font-weight: 550; margin-bottom: 4px; }
label.field > span.lbl .req { color: var(--bad); }
.help { color: var(--muted); font-size: 12px; margin-top: 3px; }
.err { color: var(--bad); font-size: 12px; margin-top: 3px; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=url], input[type=datetime-local], input[type=search], select, textarea {
  font: inherit; width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink);
}
textarea { min-height: 90px; resize: vertical; }
textarea.code, .mono { font-family: var(--mono); font-size: 12.5px; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.chip { display: inline-block; background: var(--chip); border-radius: 10px; padding: 1px 8px; font-size: 12px; }
.chip.published, .chip.ok, .chip.approved, .chip.passes { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.chip.draft, .chip.open, .chip.yours_to_judge { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.chip.archived, .chip.rejected, .chip.fails, .chip.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.block { border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; background: var(--panel); }
.block > header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--bg); border-radius: var(--radius) var(--radius) 0 0; }
.block > header strong { flex: 1; }
.block > .body { padding: 12px; }
.block.collapsed > .body { display: none; }
.nest { border-left: 3px solid var(--line); padding-left: 12px; margin: 6px 0 10px; }
.item { border: 1px dashed var(--line); border-radius: 6px; padding: 10px; margin-bottom: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; cursor: pointer; }
.tile .img { aspect-ratio: 4/3; background: var(--chip) center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }
.tile .cap { padding: 6px 8px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.pick { outline: 3px solid var(--accent); }
.thumb { width: 72px; height: 54px; border-radius: 4px; background: var(--chip) center/cover no-repeat; flex: none; }
.cols { display: grid; grid-template-columns: 1fr 300px; gap: 20px; align-items: start; }
.toast { position: fixed; right: 20px; bottom: 20px; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; max-width: 420px; z-index: 50; box-shadow: 0 6px 24px #0003; }
.toast.bad { background: var(--bad); color: #fff; }
.modal-bg { position: fixed; inset: 0; background: #0006; display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
.modal { background: var(--panel); border-radius: 10px; padding: 18px; width: min(900px, 100%); max-height: 88vh; overflow: auto; }
.empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: var(--radius); }
.auth { max-width: 380px; margin: 12vh auto; }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow: auto; font: 12px/1.45 var(--mono); max-height: 420px; }
.secret { font-family: var(--mono); background: var(--chip); padding: 8px; border-radius: 6px; word-break: break-all; user-select: all; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  nav.side { position: static; height: auto; }
  main { padding: 16px; }
  .cols { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
// The admin: one file, no build. It works the same /api the CLI and agents
// use, signed in by a session cookie, and sends the session's CSRF token on
// every write.

const S = { me: null, csrf: "", blockTypes: null, collections: null, revisionsOpen: 0 };

// ---- tiny DOM ----------------------------------------------------------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const $ = (sel, root = document) => root.querySelector(sel);
function toast(msg, bad) {
  const t = h("div", { class: "toast" + (bad ? " bad" : ""), role: "status" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), bad ? 6000 : 3000);
}
function chip(text, cls) { return h("span", { class: "chip " + (cls || text || "") }, text); }
function when(t) { if (!t) return "—"; const d = new Date(t); return isNaN(d) ? t : d.toLocaleString(); }
function esc(s) { return encodeURIComponent(s); }
function modal(title, body, onClose) {
  const bg = h("div", { class: "modal-bg", onclick: (e) => { if (e.target === bg) close(); } });
  const close = () => { bg.remove(); onClose && onClose(); };
  bg.append(h("div", { class: "modal", role: "dialog", "aria-label": title },
    h("div", { class: "top" }, h("h1", {}, title), h("button", { onclick: close }, "Close")), body));
  document.body.append(bg);
  return close;
}

// ---- the API -------------------------------------------------------------
class ApiError extends Error {
  constructor(status, body) { super((body && (body.message || body.error)) || ("HTTP " + status)); this.status = status; this.body = body || {}; }
}
async function api(method, path, body, opts = {}) {
  const headers = { Accept: "application/json" };
  let payload = body;
  if (body !== undefined && !(body instanceof FormData) && !(body instanceof Blob)) { headers["Content-Type"] = "application/json"; payload = JSON.stringify(body); }
  if (method !== "GET") headers["X-CSRF-Token"] = S.csrf;
  const res = await fetch("/api" + path, { method, headers, body: payload, credentials: "same-origin" });
  if (res.status === 204) return null;
  const text = await res.text();
  let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = { message: text }; }
  if (res.status === 401 && !opts.quiet) { S.me = null; boot(); }
  if (!res.ok) throw new ApiError(res.status, data);
  data = data || {}; data.__status = res.status;
  return data;
}
function fail(e) { console.error(e); toast(e.status === 403 ? `Your role doesn't allow that (${e.body.capability || "forbidden"}).` : e.message, true); }
const can = (cap) => S.me && S.me.capabilities.includes(cap);

// The answer to a write: saved, held for review (202), or unchanged.
function reportWrite(res, what) {
  if (res && res.__status === 202) {
    toast(`Held for review (revision ${res.revision.id}): the live ${what} is unchanged until someone approves it.`);
    return "held";
  }
  if (res && res.status === "unchanged") { toast("Nothing changed."); return "unchanged"; }
  toast("Saved.");
  return "saved";
}
function showErrors(form, e) {
  form.querySelectorAll(".err").forEach((n) => n.remove());
  const errs = (e.body && e.body.errors) || {};
  const loose = [];
  for (const [key, msgs] of Object.entries(errs)) {
    const target = form.querySelector(`[data-path="${CSS.escape(key)}"]`);
    if (target) target.append(h("div", { class: "err" }, msgs.join(", ")));
    else loose.push(`${key}: ${msgs.join(", ")}`);
  }
  if (loose.length) form.prepend(h("div", { class: "err card" }, loose.map((l) => h("div", {}, l))));
  toast(e.message || "Some fields need attention.", true);
}

// ---- boot & routing ------------------------------------------------------
async function boot() {
  try { const s = await api("GET", "/session", undefined, { quiet: true }); S.site = s.site; S.version = s.version;
    if (s.signed_in) { S.me = s; S.csrf = s.csrf; } else { S.me = null; S.needsSetup = s.needs_setup; }
  } catch (e) { S.me = null; }
  route();
}
window.addEventListener("hashchange", route);

const ROUTES = [
  [/^#\/?$/, dashboard],
  [/^#\/pages$/, pagesList],
  [/^#\/pages\/new$/, () => pageEdit(null)],
  [/^#\/pages\/edit\/(.+)$/, (m) => pageEdit(decodeURIComponent(m[1]))],
  [/^#\/collections$/, collectionsList],
  [/^#\/collections\/new$/, () => collectionEdit(null)],
  [/^#\/collections\/([^/]+)\/settings$/, (m) => collectionEdit(m[1])],
  [/^#\/collections\/([^/]+)$/, (m) => entriesList(m[1])],
  [/^#\/collections\/([^/]+)\/new$/, (m) => entryEdit(m[1], null)],
  [/^#\/collections\/([^/]+)\/edit\/([^/]+)$/, (m) => entryEdit(m[1], m[2])],
  [/^#\/globals$/, globalsList],
  [/^#\/globals\/new$/, () => globalEdit(null)],
  [/^#\/globals\/([^/]+)$/, (m) => globalEdit(m[1])],
  [/^#\/media$/, mediaLibrary],
  [/^#\/blocks$/, blockTypesList],
  [/^#\/blocks\/new$/, () => blockTypeEdit(null)],
  [/^#\/blocks\/([^/]+)$/, (m) => blockTypeEdit(m[1])],
  [/^#\/revisions$/, revisionsList],
  [/^#\/revisions\/(\d+)$/, (m) => revisionShow(m[1])],
  [/^#\/redirects$/, redirectsPage],
  [/^#\/webhooks$/, webhooksPage],
  [/^#\/trash$/, trashPage],
  [/^#\/users$/, usersPage],
  [/^#\/roles$/, rolesPage],
  [/^#\/tokens$/, tokensPage],
  [/^#\/plugins$/, pluginsPage],
  [/^#\/plugins\/([^/]+)\/([^/]+)$/, (m) => pluginScreen(m[1], m[2])],
  [/^#\/settings$/, settingsPage],
  [/^#\/audit$/, auditPage],
  [/^#\/connect/, connectPage],
  [/^#\/account$/, accountPage],
];

async function route() {
  const root = $("#root");
  if (!S.me) { root.replaceChildren(S.needsSetup ? setupView() : signInView()); return; }
  const hash = location.hash.split("?")[0] || "#/";
  const main = h("main", { id: "main" }, h("p", { class: "sub" }, "Loading…"));
  root.replaceChildren(h("div", { class: "app" }, sideNav(hash), main));
  for (const [re, fn] of ROUTES) {
    const m = hash.match(re);
    if (m) {
      try { const view = await fn(m); if (view) main.replaceChildren(...[view].flat(Infinity).filter((x) => x != null && x !== false)); }
      catch (e) { main.replaceChildren(h("div", { class: "card err" }, e.status === 403 ? `Your role doesn't allow this (${e.body.capability}).` : e.message)); }
      return;
    }
  }
  main.replaceChildren(h("div", { class: "empty" }, "Nothing here."));
}

function sideNav(hash) {
  const link = (href, label, cap, count) => (!cap || can(cap)) ? h("a", { href, class: hash === href || (href !== "#/" && hash.startsWith(href + "/")) ? "on" : "" }, label, count ? h("span", { class: "count" }, count) : null) : null;
  const cols = (S.collections || []).map((c) => link("#/collections/" + c.slug, c.name, "entries:read"));
  api("GET", "/revisions").then((r) => { const n = r.revisions.length; const a = document.querySelector('nav.side a[href="#/revisions"]'); if (a && n) a.append(h("span", { class: "count" }, n)); }).catch(() => {});
  return h("nav", { class: "side", "aria-label": "Admin" },
    h("div", { class: "brand" }, h("span", {}, S.site || "Libre Publish"), themeToggle()),
    link("#/", "Dashboard"),
    h("div", { class: "group" }, "Content"),
    link("#/pages", "Pages", "pages:read"),
    cols,
    link("#/collections", "Collections", "collections:read"),
    link("#/globals", "Globals", "globals:read"),
    link("#/media", "Media", "assets:read"),
    link("#/revisions", "Review"),
    link("#/trash", "Trash", "trash:read"),
    h("div", { class: "group" }, "Structure"),
    link("#/blocks", "Block types", "block_types:read"),
    link("#/redirects", "Redirects", "redirects:read"),
    h("div", { class: "group" }, "Site"),
    link("#/settings", "Settings", "settings:read"),
    link("#/webhooks", "Webhooks", "webhooks:read"),
    link("#/plugins", "Plugins", "plugins:read"),
    link("#/tokens", "Service tokens", "settings:read"),
    link("#/users", "Users", "users:read"),
    link("#/roles", "Roles", "roles:read"),
    link("#/audit", "Audit log", "audit_log:read"),
    h("div", { class: "group" }, S.me.user.name),
    link("#/account", "Your account"),
    h("a", { href: "#", onclick: async (e) => { e.preventDefault(); await api("DELETE", "/session").catch(() => {}); S.me = null; boot(); } }, "Sign out"));
}

function themeToggle() {
  let t = null; try { t = localStorage.getItem("lp-theme"); } catch {}
  if (t) document.documentElement.dataset.theme = t;
  return h("button", { class: "small", title: "Light or dark", "aria-label": "Switch light or dark", onclick: () => {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    const next = dark ? "light" : "dark"; document.documentElement.dataset.theme = next; try { localStorage.setItem("lp-theme", next); } catch {}
  } }, "◐");
}

// ---- sign in & setup -----------------------------------------------------
function signInView() {
  const email = h("input", { type: "email", name: "email", required: true, autocomplete: "username" });
  const password = h("input", { type: "password", name: "password", required: true, autocomplete: "current-password" });
  const form = h("form", { class: "card auth", onsubmit: async (e) => {
    e.preventDefault();
    try { const r = await api("POST", "/session", { email: email.value, password: password.value }, { quiet: true }); S.csrf = r.csrf; await boot(); }
    catch (err) { toast(err.message, true); }
  } },
    h("h1", {}, S.site || "Libre Publish"), h("p", { class: "sub" }, "Sign in to the admin."),
    field("Email", email), field("Password", password),
    h("button", { class: "primary" }, "Sign in"));
  return form;
}
function setupView() {
  const site = h("input", { type: "text", name: "site", required: true }), name = h("input", { type: "text", name: "person", required: true });
  const email = h("input", { type: "email", name: "email", required: true }), password = h("input", { type: "password", name: "password", required: true, minlength: 10, autocomplete: "new-password" });
  const form = h("form", { class: "card auth", onsubmit: async (e) => {
    e.preventDefault();
    try { const r = await api("POST", "/setup", { site: site.value, name: name.value, email: email.value, password: password.value }, { quiet: true }); S.csrf = r.csrf; await boot(); }
    catch (err) { showErrors(form, err); }
  } },
    h("h1", {}, "Set up your CMS"), h("p", { class: "sub" }, "Make the first administrator. You can add everyone else after."),
    field("Site name", site, "site"), field("Your name", name, "name"), field("Email", email, "email"),
    field("Password", password, "password", "At least 10 characters."),
    h("button", { class: "primary" }, "Create and sign in"));
  return form;
}
function field(label, input, path, help, required) {
  return h("label", { class: "field", "data-path": path || null }, h("span", { class: "lbl" }, label, required ? h("span", { class: "req" }, " *") : null), input, help ? h("div", { class: "help" }, help) : null);
}

// ---- shared loaders ------------------------------------------------------
async function blockTypes() { if (!S.blockTypes) S.blockTypes = (await api("GET", "/block_types")).block_types; return S.blockTypes; }
async function loadCollections() { S.collections = (await api("GET", "/collections")).collections; return S.collections; }
const entryCache = {};
async function entriesOf(slug) { if (!entryCache[slug]) entryCache[slug] = (await api("GET", `/collections/${esc(slug)}/entries?per=100`)).entries; return entryCache[slug]; }

// ---- dashboard -----------------------------------------------------------
async function dashboard() {
  const [m, health] = await Promise.all([api("GET", "/manifest"), api("GET", "/site_health").catch(() => null)]);
  if (!S.collections) { S.collections = m.collections; }
  const c = m.counts;
  return [
    h("div", { class: "top" }, h("div", {}, h("h1", {}, S.site || "Dashboard"), h("div", { class: "sub" }, `Libre Publish ${m.version}`))),
    h("div", { class: "grid" }, [["Pages", c.pages, "#/pages"], ["Entries", c.entries, "#/collections"], ["Collections", c.collections, "#/collections"], ["Block types", c.block_types, "#/blocks"], ["Globals", c.globals, "#/globals"]]
      .map(([l, n, href]) => h("a", { class: "card", href }, h("h3", {}, l), h("div", { style: "font-size:26px;font-weight:600" }, n)))),
    health ? [h("h2", {}, "Site health"), h("table", {}, h("tbody", {}, health.checks.map((ch) => h("tr", {}, h("td", { style: "width:130px" }, chip(ch.state)), h("td", {}, ch.message)))))] : null,
    m.block_types.length === 0 && can("block_types:write") ? h("div", { class: "card" }, "No block types yet. ", h("button", { onclick: async () => { await api("POST", "/block_types/seed"); S.blockTypes = null; toast("Starter block types installed."); route(); } }, "Install the starter pack")) : null,
  ];
}

// ---- pages ---------------------------------------------------------------
async function pagesList() {
  const q = new URLSearchParams(location.hash.split("?")[1] || "");
  const r = await api("GET", `/pages?per=100&${q}`);
  const rows = r.pages.slice().sort((a, b) => a.path.localeCompare(b.path));
  return [
    h("div", { class: "top" }, h("div", {}, h("h1", {}, "Pages"), h("div", { class: "sub" }, `${r.total} pages`)),
      h("div", { class: "row" }, ["", "draft", "published", "archived"].map((s) => h("a", { class: "btn", href: "#/pages" + (s ? "?status=" + s : "") }, s || "All")),
        can("pages:write") ? h("button", { class: "primary", onclick: () => location.hash = "#/pages/new" }, "New page") : null)),
    rows.length ? h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Title"), h("th", {}, "Path"), h("th", {}, "Status"), h("th", {}, "Updated"))),
      h("tbody", {}, rows.map((p) => h("tr", { class: "click", onclick: () => location.hash = "#/pages/edit/" + esc(p.path) },
        h("td", { style: `padding-left:${12 + p.depth * 18}px` }, p.title), h("td", { class: "mono" }, "/" + p.path), h("td", {}, chip(p.status)), h("td", {}, when(p.updated_at))))))
      : h("div", { class: "empty" }, "No pages yet."),
  ];
}

// ---- plugins -------------------------------------------------------------
async function pluginsPage() {
  const r = await api("GET", "/plugins");
  const input = h("input", { type: "file", accept: ".wasm,application/wasm", style: "display:none", onchange: async () => {
    const f = input.files[0]; if (!f) return;
    try { const res = await api("POST", "/plugins", f); toast(`Installed ${res.plugin.name}: grant what it asks for to switch it on.`); route(); } catch (e) { fail(e); }
  } });
  const card = (p) => {
    const want = p.requested || {};
    const grant = { "content:read": !!(p.granted || {})["content:read"], storage: !!(p.granted || {}).storage, http: [...((p.granted || {}).http || [])] };
    const box = (label, on, set) => h("label", { class: "chip" }, h("input", { type: "checkbox", checked: on, onchange: (e) => set(e.target.checked) }), " ", label);
    const asks = [
      want["content:read"] ? box("Read live content", grant["content:read"], (v) => grant["content:read"] = v) : null,
      want.storage ? box("Its own storage", grant.storage, (v) => grant.storage = v) : null,
      (want.http || []).map((host) => box("Call " + host, grant.http.includes(host), (v) => { grant.http = v ? [...grant.http, host] : grant.http.filter((x) => x !== host); })),
    ];
    const save = async (enabled) => { try { await api("PATCH", "/plugins/" + p.key, { plugin: { granted: grant, enabled } }); toast(enabled ? "Switched on." : "Saved."); route(); } catch (e) { fail(e); } };
    const screens = (p.admin && p.admin.screens) || [];
    return h("div", { class: "card" },
      h("div", { class: "top" }, h("div", {}, h("h1", {}, p.name, " ", h("span", { class: "sub" }, p.version)), h("div", { class: "sub" }, p.description)), chip(p.enabled ? "on" : "off", p.enabled ? "ok" : "draft")),
      h("h3", {}, "Asks for"), h("div", { class: "row", style: "margin:6px 0 12px" }, asks.flat().filter(Boolean).length ? asks : h("span", { class: "sub" }, "Nothing beyond logging.")),
      p.hooks && p.hooks.length ? h("p", { class: "sub" }, "Hears: ", p.hooks.join(", ")) : null,
      p.routes && p.routes.length ? h("p", { class: "sub mono" }, p.routes.map((rt) => `${rt.method} /api/x/${p.key}${rt.path}${rt.public ? " (public)" : ""}`).join(" · ")) : null,
      screens.length ? h("div", { class: "row" }, screens.map((s) => h("a", { class: "btn", href: `#/plugins/${p.key}/${s.id}` }, s.title))) : null,
      can("plugins:write") ? h("div", { class: "row", style: "margin-top:12px" },
        h("button", { class: "primary", onclick: () => save(true) }, p.enabled ? "Save grants" : "Grant and switch on"),
        p.enabled ? h("button", { onclick: () => save(false) }, "Switch off") : null,
        h("button", { class: "danger", onclick: async () => { if (!confirm(`Remove ${p.name}? Keep its stored data to reinstall later?`)) return; await api("DELETE", "/plugins/" + p.key); route(); } }, "Remove")) : null);
  };
  return [h("div", { class: "top" }, h("div", {}, h("h1", {}, "Plugins"), h("p", { class: "sub" }, "WebAssembly modules. Each can do only what it asks for and you grant: it can't touch the database, the files, or the network beyond the hosts it names.")),
    can("plugins:write") ? h("div", {}, input, h("button", { class: "primary", onclick: () => input.click() }, "Upload a plugin (.wasm)")) : null),
    r.plugins.length ? r.plugins.map(card) : h("div", { class: "empty" }, "No plugins installed.")];
}
// A plugin's admin screen, described as data: a table drawn from one of its routes.
async function pluginScreen(key, id) {
  const p = (await api("GET", "/plugins/" + key)).plugin;
  const s = ((p.admin && p.admin.screens) || []).find((x) => x.id === id);
  if (!s) return h("div", { class: "empty" }, "No such screen.");
  const data = await api("GET", `/x/${key}${s.source}`);
  const rows = (s.table && data[s.table.rows]) || [];
  return [h("h1", {}, s.title), s.table ? h("table", {}, h("thead", {}, h("tr", {}, s.table.columns.map((c) => h("th", {}, c.label)))),
    h("tbody", {}, rows.map((row) => h("tr", {}, s.table.columns.map((c) => h("td", {}, row[c.key] == null ? "" : String(row[c.key])))))))
    : h("pre", {}, JSON.stringify(data, null, 2))];
}

// ---- settings ------------------------------------------------------------
async function settingsPage() {
  const get = (k) => api("GET", "/settings/" + k).then((r) => r.setting.data).catch(() => ({}));
  const [general, deploy, brand, github, health] = await Promise.all([get("general"), api("GET", "/deploy").catch(() => null), get("brand"), get("github"), Promise.resolve(null)]);
  const section = (title, key, defs, data, help) => {
    const d = { ...data };
    const form = h("form", { class: "card", onsubmit: async (e) => { e.preventDefault(); try { await api("PATCH", "/settings/" + key, { setting: { data: d } }); toast("Saved."); if (key === "general") { S.site = d.title; } } catch (err) { showErrors(form, err); } } },
      h("h2", { style: "margin-top:0" }, title), help ? h("p", { class: "sub" }, help) : null, fieldsForm(defs, d, "", []), can("settings:write") ? h("button", { class: "primary" }, "Save") : null);
    return form;
  };
  const deployForm = () => {
    const cfg = { ...((deploy && deploy.deploy.config) || {}) };
    const last = deploy && deploy.deploy.last;
    return h("form", { class: "card", onsubmit: async (e) => { e.preventDefault(); try { await api("PATCH", "/deploy", { deploy: cfg }); toast("Saved."); } catch (err) { fail(err); } } },
      h("h2", { style: "margin-top:0" }, "Deploy"), h("p", { class: "sub" }, "Publishing rebuilds the site through this hook, a few seconds after the last change."),
      fieldsForm([{ name: "hook_url", label: "Build hook URL", type: "url" }, { name: "debounce_seconds", label: "Wait (seconds) before building", type: "integer" }], cfg, "", []),
      last && last.status ? h("p", {}, "Last: ", chip(last.status, last.status === "success" ? "ok" : "bad"), " ", when(last.at), last.error ? " — " + last.error : "") : null,
      h("div", { class: "row" }, can("settings:write") ? h("button", { class: "primary" }, "Save") : null, can("pages:publish") ? h("button", { type: "button", onclick: async () => { try { await api("POST", "/deploy/trigger"); toast("Deploy started."); } catch (e) { fail(e); } } }, "Rebuild now") : null));
  };
  return [h("h1", {}, "Settings"),
    section("General", "general", [
      { name: "title", label: "Site name", type: "string" }, { name: "site_base_url", label: "Public site URL", type: "url", help: "Where the site lives (https://example.com): webhooks and the sitemap use it." },
      { name: "default_locale", label: "Default locale", type: "string" },
      { name: "serving", label: "How the site is served", type: "select", options: ["api_only", "website_api"], help: "api_only: everything live is on the delivery API. website_api: only the collections marked “Available over the API”, and pages when switched on below." },
      { name: "api_pages", label: "Serve pages and globals (website_api)", type: "boolean" },
      { name: "cors_origins", label: "Allowed origins", type: "text", help: "Browsers on these origins may call the delivery API and post forms. One per line." },
      { name: "phone", label: "Phone", type: "string" }, { name: "email", label: "Email", type: "string" }, { name: "address_line1", label: "Address", type: "string" },
      { name: "city", label: "City", type: "string" }, { name: "state", label: "State", type: "string" }, { name: "zip", label: "Postal code", type: "string" },
    ], general),
    deployForm(),
    section("Brand brief", "brand", [{ name: "brand_voice", label: "Voice", type: "text" }, { name: "audience", label: "Audience", type: "text" }, { name: "key_facts", label: "Facts that must stay accurate", type: "text" }, { name: "style_notes", label: "House style", type: "text" }], brand, "What agents read before they write copy (cms brand)."),
    section("Site repository", "github", [{ name: "frontend_github_repo", label: "Frontend repo (owner/name)", type: "string" }], github, "The Astro (or other) site this CMS publishes."),
  ];
}

// ---- audit, account, connect ---------------------------------------------
async function auditPage() {
  const r = await api("GET", "/audit_log?per=100");
  return [h("h1", {}, "Audit log"), h("table", {}, h("tbody", {}, r.audit_logs.map((x) => h("tr", {}, h("td", {}, when(x.created_at)), h("td", {}, x.actor.label), h("td", { class: "mono" }, x.action), h("td", {}, x.target.label)))))];
}
async function accountPage() {
  const cur = h("input", { type: "password", autocomplete: "current-password" }), pw = h("input", { type: "password", autocomplete: "new-password" });
  const form = h("form", { class: "card", style: "max-width:420px", onsubmit: async (e) => { e.preventDefault(); try { await api("PATCH", "/users/" + S.me.user.id, { user: { current_password: cur.value, password: pw.value } }); toast("Password changed; other sessions were signed out."); cur.value = pw.value = ""; } catch (err) { showErrors(form, err); } } },
    h("h2", { style: "margin-top:0" }, "Change your password"), field("Current password", cur, "current_password"), field("New password", pw, "password", "At least 10 characters."), h("button", { class: "primary" }, "Change password"));
  const tokenBox = h("div", {});
  return [h("h1", {}, S.me.user.name), h("p", { class: "sub" }, S.me.user.email), form,
    h("div", { class: "card", style: "max-width:620px" }, h("h2", { style: "margin-top:0" }, "Your API token"), h("p", { class: "sub" }, "For the cms CLI on a machine where `cms login` can't open a browser. Rotating replaces the one you have."),
      h("button", { onclick: async () => { if (!confirm("Rotate your token? The old one stops working.")) return; const r = await api("POST", "/api_tokens/rotate"); tokenBox.replaceChildren(h("div", { class: "secret" }, r.token.token)); } }, "Rotate and show"), tokenBox)];
}
async function connectPage() {
  const code = new URLSearchParams(location.hash.split("?")[1] || "").get("code") || "";
  const input = h("input", { type: "text", value: code, placeholder: "ABCD-EFGH", style: "max-width:200px;text-transform:uppercase" });
  const info = h("div", {});
  const look = async () => { info.replaceChildren(); if (!input.value) return; try { const d = await api("GET", "/device/" + esc(input.value.toUpperCase())); info.replaceChildren(h("p", {}, `A ${d.purpose === "site" ? "site build" : "cms CLI"} on `, h("strong", {}, d.hostname || "a machine"), " asks to act as you.")); } catch (e) { info.replaceChildren(h("p", { class: "err" }, e.message)); } };
  if (code) look();
  const decide = async (approve) => { try { await api("POST", "/device/approve", { user_code: input.value.toUpperCase(), approve }); toast(approve ? "Approved: go back to your terminal." : "Denied."); location.hash = "#/"; } catch (e) { fail(e); } };
  return h("div", { class: "card", style: "max-width:520px" }, h("h1", {}, "Connect a device"), h("p", { class: "sub" }, "Approve the code your terminal shows. Only approve a code you started yourself."),
    h("div", { class: "row" }, input, h("button", { onclick: look }, "Look up")), info,
    h("div", { class: "row" }, h("button", { class: "primary", onclick: () => decide(true) }, "Approve"), h("button", { class: "danger", onclick: () => decide(false) }, "Deny")));
}

boot();
</script>
