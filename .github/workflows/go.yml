# The Go core (go/): vet and the integration tests, which hold it to the
# Rails core's contracts (spec/fixtures/contracts) and build the example
# WebAssembly plugin.
name: Go

on:
  push:
    branches: [main, go-rewrite]
    paths: ["go/**", "spec/fixtures/contracts/**", ".github/workflows/go.yml"]
  pull_request:
    paths: ["go/**", "spec/fixtures/contracts/**", ".github/workflows/go.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: make test
      - run: make dist
