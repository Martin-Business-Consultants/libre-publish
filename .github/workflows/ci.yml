# vet, gofmt and the integration tests (which hold the CMS to contracts/
# and build the example WebAssembly plugin), on every push and pull request.
name: CI

on:
  push:
    branches: [main, go-rewrite]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: make test
      - run: make dist
