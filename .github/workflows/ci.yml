# The same checks as bin/ci (config/ci.rb), on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libvips, as the Dockerfile installs: the Media plugin (a default
      # plugin) loads image_processing's vips at boot.
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - run: bin/ci

  # The Astro integration (integrations/astro), on the same contracts/ the
  # Rails specs record: a change to the delivery API fails here until the
  # integration follows.
  astro:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/astro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integrations/astro/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
