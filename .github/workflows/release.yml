# Publishes a release when a version tag is pushed (bin/release does both),
# with that version's CHANGELOG.md section as its notes. Every install's daily
# check then sees it, and Settings › Updates offers it to the owner.
#
# Each release also carries the bundle a Docker install updates itself with
# (Upgrade::InPlace): the Dockerfile's `bundle` stage for amd64 and arm64 (the
# app, its gems, the default plugins and the Ruby they run on), with its
# checksum, and a manifest naming the base it needs. Started by hand (Actions
# › Release › Run workflow), it builds and checks the bundles for a commit
# without publishing anything.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION ($version). Cut releases with bin/release."
            exit 1
          fi

      - name: Notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no ## $version section"; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file notes.md --title "Libre Publish ${GITHUB_REF_NAME#v}"

      - name: Attach the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ruby_version="$(sed -n 's/^ARG RUBY_VERSION=//p' Dockerfile)"
          base="$(sed -n 's/.*CMS_BASE="\([^"]*\)".*/\1/p' Dockerfile)"
          printf '{"version":"%s","ruby":"%s","base":"%s","bundles_ruby":true}\n' "${GITHUB_REF_NAME#v}" "$ruby_version" "$base" > "cms-$GITHUB_REF_NAME.json"
          gh release upload "$GITHUB_REF_NAME" "cms-$GITHUB_REF_NAME.json"

  bundle:
    needs: release
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the bundle
        run: docker buildx build --target bundle --platform "linux/${{ matrix.arch }}" --output type=tar,dest=bundle.tar .

      - name: Check it boots on another Ruby
        run: bin/check-bundle bundle.tar

      - name: Attach it
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="cms-$GITHUB_REF_NAME-linux-${{ matrix.arch }}.tar.gz"
          gzip -c bundle.tar > "$name"
          sha256sum "$name" > "$name.sha256"
          gh release upload "$GITHUB_REF_NAME" "$name" "$name.sha256"
