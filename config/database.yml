# SQLite. One install, one data directory: every database and every uploaded
# file for this site lives under CMS_DATA_DIR (default storage/), so backing
# up that directory backs up the install.

#
# One writer at a time is SQLite's rule; Rails 8.1 makes waiting for it cheap.
# `timeout` is the adapter's busy_handler_timeout: a connection that finds the
# database locked retries for up to that long, without holding Ruby's global
# lock, instead of failing with SQLite3::BusyException. Transactions begin
# IMMEDIATE, so a reader never fails trying to become a writer mid-transaction,
# and the database runs in WAL mode, so readers never wait on the writer.
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

<% data_dir = ENV.fetch("CMS_DATA_DIR", "storage") %>
production:
  primary:
    <<: *default
    database: <%= data_dir %>/production.sqlite3
  cache:
    <<: *default
    database: <%= data_dir %>/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= data_dir %>/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= data_dir %>/production_cable.sqlite3
    migrations_paths: db/cable_migrate
