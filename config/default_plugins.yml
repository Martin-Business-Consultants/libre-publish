# The plugins every install gets at setup — bin/setup, bin/install and the
# Docker build (bin/fetch-plugins) — as `directory name: git URL[#ref]`. They
# are plugins like any other, so an install can go without one or swap it
# for another: remove it with `bin/rails "plugins:remove[forms]"`, or on
# Docker list `-forms` in CMS_PLUGINS (docs/plugins.md).
#
# Each is pinned to the commit this release is tested with (CI runs their
# specs), so a build gets the same code whenever it runs. Move a pin with
# the release that's tested against the new commit.
forms: https://github.com/Martin-Business-Consultants/cms-forms#a544b3444273dec28d80865f68f8c159cc9da909
media: https://github.com/Martin-Business-Consultants/cms-media#d12b44f365e24c2b0573c77d4c782d5835316fd1
